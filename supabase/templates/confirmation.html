<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#020617;color:#e2e8f0;font-family:Arial,sans-serif;padding:32px 16px">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:32px">
            <tr><td style="color:#34d399;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Prontusfy</td></tr>
            <tr><td style="padding-top:18px;color:#ffffff;font-size:26px;font-weight:700">Confirme seu cadastro</td></tr>
            <tr><td style="padding-top:12px;color:#94a3b8;font-size:15px;line-height:24px">Use o codigo abaixo para confirmar seu e-mail e acessar o painel.</td></tr>
            <tr><td align="center" style="padding:28px 0"><div style="display:inline-block;border:1px solid rgba(52,211,153,.35);border-radius:14px;background:rgba(52,211,153,.08);padding:16px 24px;color:#6ee7b7;font-size:32px;font-weight:800;letter-spacing:10px">{{ .Token }}</div></td></tr>
            <tr><td style="color:#64748b;font-size:13px;line-height:20px">Este codigo e pessoal e expira automaticamente. Se voce nao solicitou este cadastro, ignore esta mensagem.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
