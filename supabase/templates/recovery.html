<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#020617;color:#e2e8f0;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:32px auto;padding:40px 28px;background:#0f172a;border:1px solid #1e293b;border-radius:20px">
      <p style="color:#34d399;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase">Prontusfy</p>
      <h1 style="color:#fff;font-size:28px;margin:20px 0 12px">Codigo para redefinir sua senha</h1>
      <p style="color:#94a3b8;font-size:16px;line-height:1.6">Use o codigo abaixo para confirmar sua identidade e criar uma nova senha.</p>
      <div style="margin:28px 0;padding:20px;text-align:center;background:#020617;border:1px solid #10b981;border-radius:16px;color:#34d399;font-size:36px;font-weight:700;letter-spacing:10px">{{ .Token }}</div>
      <p style="color:#64748b;font-size:13px;line-height:1.6">Se voce nao solicitou esta alteracao, ignore este e-mail. Por seguranca, o codigo expira em pouco tempo e pode ser usado uma unica vez.</p>
    </div>
  </body>
</html>
